# logging
logging:
  level:
    es.upm: DEBUG
    org.springframework.security: DEBUG

# H2 Embedded
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb

miw:
  jwt:
    secret: jwt-secret
  oauth2:
    client-id: client-id
    client-secret: client-secret
    redirect-uri: http://localhost:8080/login/oauth2/code/cliente-oidc
    issuer: http://localhost:8080
